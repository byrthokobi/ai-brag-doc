services:
  postgres:
    image: postgres:18
    container_name: ai-brag-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: ai_brag_doc
    ports:
      - "5433:5432"
    volumes:
      - ai_brag_postgres_data:/var/lib/postgresql
  redis:
    image: redis:7-alpine
    container_name: ai-brag-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  ai_brag_postgres_data: